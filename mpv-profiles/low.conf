# Пресет Low: без нейросетевой обработки, для встроенных и старых видеокарт.
# Подключается лаунчером через: mpv --include=<этот файл> --profile=film|anime <url>

vo=gpu-next
hwdec=auto-safe
scale=spline36
cscale=spline36
dscale=mitchell
deband=no
fs=yes

# Секции нужны, потому что лаунчер всегда включает профиль контента.
# Пустой список также убирает шейдеры, добавленные глобальным конфигом mpv.
[film]
glsl-shaders=""

[anime]
glsl-shaders=""
