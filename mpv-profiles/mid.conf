# Пресет Mid: облегчённая нейросетевая обработка для средних видеокарт.
# Подключается лаунчером через: mpv --include=<этот файл> --profile=film|anime <url>

vo=gpu-next
hwdec=auto-safe
profile=gpu-hq
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell

# Окно размером с видео (1:1) выключает FSRCNNX: шейдер работает только от масштаба > 1.3x
fs=yes

# Плавное движение настраивается в приложении; здесь значения по умолчанию для CLI.
video-sync=display-resample
interpolation=yes
tscale=mitchell
tscale-clamp=0
blend-subtitles=yes

# Кино/сериалы: облегчённый FSRCNNX x8 и KrigBilateral для цвета.
[film]
glsl-shaders="~~/shaders/FSRCNNX_x2_8-0-4-1.glsl"
glsl-shaders-append="~~/shaders/KrigBilateral.glsl"

# Аниме: облегчённые варианты Anime4K.
[anime]
glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl"
glsl-shaders-append="~~/shaders/Anime4K_Restore_CNN_M.glsl"
glsl-shaders-append="~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"
