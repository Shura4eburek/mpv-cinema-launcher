# Профиль апскейла для десктопа: NVIDIA RTX 4070 Ti, монитор 1440p+.
# Подключается лаунчером через: mpv --include=<этот файл> --profile=film|anime <url>

vo=gpu-next
# gpu-api не задаётся: на Windows выбирается d3d11. С Vulkan при интерполяции на 180 Гц
# задерживалось более 10 кадров в секунду, видео заметно подфризивало.
hwdec=auto-safe
profile=gpu-hq
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell

# Окно размером с видео (1:1) выключает FSRCNNX: шейдер работает только от масштаба > 1.3x
fs=yes

# Генератор кадров / плавная интерполяция движений под герцовку монитора (60/144/165/240 Гц)
video-sync=display-resample
interpolation=yes
tscale=mitchell
tscale-clamp=0
blend-subtitles=yes

# Показ информации по хоткею 'i' или 'I'
osd-font-size=28
osd-color="#CCFFFFFF"

# Кино/сериалы: нейросетевой прескейлер FSRCNNX x16 (для RTX 4070 Ti)
[film]
glsl-shaders="~~/shaders/FSRCNNX_x2_16-0-4-1.glsl"

# Аниме: Anime4K, тяжёлые VL-варианты
[anime]
glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl"
glsl-shaders-append="~~/shaders/Anime4K_Restore_CNN_VL.glsl"
glsl-shaders-append="~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl"
glsl-shaders-append="~~/shaders/Anime4K_AutoDownscalePre_x2.glsl"
glsl-shaders-append="~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"
