# Профиль апскейла для MacBook Air M1 (безвентиляторный). Бережём GPU/батарею.
# Требует файлов шейдеров в каталоге шейдеров mpv (см. README.md).
# Подключается лаунчером через: mpv --include=<этот файл> --profile=film|anime <url>

vo=gpu-next
gpu-api=vulkan
hwdec=videotoolbox-copy
profile=gpu-hq
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
video-sync=display-resample
interpolation=yes
tscale=oversample

# Кино/сериалы: облегчённый FSRCNNX x8 + KrigBilateral для цвета.
# Первая строка — replace (glsl-shaders=), чтобы перекрыть глобальный mpv.conf.
[film]
glsl-shaders="~~/shaders/FSRCNNX_x2_8-0-4-1.glsl"
glsl-shaders-append="~~/shaders/KrigBilateral.glsl"

# Аниме: Anime4K, облегчённые M-варианты под M1.
[anime]
glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl"
glsl-shaders-append="~~/shaders/Anime4K_Restore_CNN_M.glsl"
glsl-shaders-append="~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"
